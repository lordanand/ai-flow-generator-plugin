<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Loan Application</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --accent: #2f5bd3;
      --accent-text: #ffffff;
      --error: #b42318;
      --border: #d5d9e0;
      --radius: 10px;
      --space: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e8ebf0;
        --muted: #a3abb9;
        --accent: #7aa2ff;
        --accent-text: #0d1120;
        --error: #ff8a7f;
        --border: #343b48;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: var(--space);
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main {
      max-width: 520px;
      margin: 40px auto;
      padding: calc(var(--space) * 1.5);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .progress { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
    h1 { font-size: 24px; margin: 0 0 var(--space); }
    label { display: block; margin-bottom: var(--space); font-weight: 600; }
    input[type="text"], input[type="email"] {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
    .choices { display: grid; gap: 10px; margin-bottom: var(--space); }
    button {
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .choices button { color: var(--text); background: var(--bg); border: 1px solid var(--border); text-align: left; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .error { color: var(--error); min-height: 1.5em; margin: 0 0 var(--space); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="progress" id="progress" aria-live="polite"></p>

    <p id="loading" hidden>Loading…</p>

    <form id="step-personal" data-step novalidate>
      <h1>Tell us about yourself</h1>
      <label>First Name <input type="text" name="first_name" autocomplete="off"></label>
      <label>Last Name <input type="text" name="last_name" autocomplete="off"></label>
      <label>Email Address <input type="email" name="email" autocomplete="off"></label>
      <p class="error" role="alert"></p>
      <button type="submit">Continue</button>
    </form>

    <form id="step-address" data-step novalidate hidden>
      <h1>Where do you live?</h1>
      <label>Street Address <input type="text" name="address" autocomplete="off"></label>
      <label>City <input type="text" name="city" autocomplete="off"></label>
      <label>Zip Code <input type="text" name="zip" inputmode="numeric" autocomplete="off"></label>
      <p class="error" role="alert"></p>
      <button type="submit">Continue</button>
    </form>

    <form id="step-dob" data-step novalidate hidden>
      <h1>What's your date of birth?</h1>
      <label>Date of Birth <input type="text" name="dob" placeholder="MM/DD/YYYY" autocomplete="off"></label>
      <p class="error" role="alert"></p>
      <button type="submit">Continue</button>
    </form>

    <section id="step-employment" data-step hidden>
      <h1>Are you currently employed or receiving benefits?</h1>
      <div class="choices">
        <button type="button" data-employment="EMPLOYED">Employed</button>
        <button type="button" data-employment="SELF_EMPLOYED">Self Employed</button>
        <button type="button" data-employment="BENEFITS">Benefits</button>
      </div>
    </section>

    <form id="step-employer" data-step novalidate hidden>
      <h1>Who's your employer?</h1>
      <label>Employer Name <input type="text" name="employer" autocomplete="off"></label>
      <p class="error" role="alert"></p>
      <button type="submit">Continue</button>
    </form>

    <form id="step-review" data-step novalidate hidden>
      <h1>Review and submit</h1>
      <p id="review-summary"></p>
      <label class="check"><input type="checkbox" name="agree"> I agree to the terms and conditions</label>
      <p class="error" role="alert"></p>
      <button type="submit">Submit Application</button>
    </form>

    <section id="step-done" data-step hidden>
      <h1>Application received</h1>
      <p id="done-message"></p>
    </section>
  </main>

  <script>
    // Local test fixture: nothing is sent anywhere. Each submit moves to the next screen after a short delay.
    const data = {};
    const order = ['personal', 'address', 'dob', 'employment', 'employer', 'review', 'done'];
    const LOADING_MS = 400;

    const rules = {
      personal: (f) =>
        !f.first_name.value.trim() || !f.last_name.value.trim() ? 'Enter your first and last name.'
        : !/^\S+@\S+\.\S+$/.test(f.email.value.trim()) ? 'Enter a valid email address.' : '',
      address: (f) =>
        !f.address.value.trim() || !f.city.value.trim() ? 'Enter your street address and city.'
        : !/^\d{5}$/.test(f.zip.value.trim()) ? 'Zip Code must be 5 digits.' : '',
      dob: (f) => (/^\d{2}\/\d{2}\/\d{4}$/.test(f.dob.value.trim()) ? '' : 'Use MM/DD/YYYY, for example 01/02/1990.'),
      employer: (f) => (f.employer.value.trim() ? '' : 'Enter your employer name.'),
      review: (f) => (f.agree.checked ? '' : 'You must agree to the terms.'),
    };

    function show(name) {
      document.querySelectorAll('[data-step]').forEach((el) => { el.hidden = true; });
      const loading = document.getElementById('loading');
      loading.hidden = false;
      setTimeout(() => {
        loading.hidden = true;
        const step = document.getElementById(`step-${name}`);
        step.hidden = false;
        const index = order.indexOf(name) + 1;
        document.getElementById('progress').textContent = name === 'done' ? '' : `Step ${index} of ${order.length - 1}`;
        if (name === 'review') {
          document.getElementById('review-summary').textContent =
            `${data.first_name} ${data.last_name}, ${data.city} — ${data.employment}`;
        }
        if (name === 'done') {
          document.getElementById('done-message').textContent =
            `Thanks, ${data.first_name}. Reference: ${data.email}`;
        }
        step.querySelector('input, button')?.focus();
      }, LOADING_MS);
    }

    document.querySelectorAll('form[data-step]').forEach((form) => {
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = form.id.replace('step-', '');
        const message = rules[name](form.elements);
        form.querySelector('.error').textContent = message;
        if (message) return;
        for (const input of form.querySelectorAll('input[name]')) {
          data[input.name] = input.type === 'checkbox' ? input.checked : input.value.trim();
        }
        show(order[order.indexOf(name) + 1]);
      });
    });

    document.querySelectorAll('[data-employment]').forEach((button) => {
      button.addEventListener('click', () => {
        data.employment = button.dataset.employment;
        // Only employed applicants are asked for an employer.
        show(data.employment === 'EMPLOYED' ? 'employer' : 'review');
      });
    });

    show('personal');
  </script>
</body>
</html>
